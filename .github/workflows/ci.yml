name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testes
        run: pytest -q
      - name: Regera dados e figuras (smoke test)
        run: |
          python data/generate_synthetic.py --out /tmp/deals.csv
          python scripts/build_figures.py
